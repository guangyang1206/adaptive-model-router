name: Provider adapter request
description: Request or propose support for a model provider.
title: "provider: "
labels: [provider, help wanted]
body:
  - type: markdown
    attributes:
      value: |
        Already supported: OpenAI, Anthropic, Gemini, DeepSeek, Qwen, vLLM, and Ollama.
        If yours is in that list, open a bug report instead — it exists and something is wrong with it.
  - type: input
    id: provider
    attributes:
      label: Provider name
      placeholder: Mistral, Cohere, Bedrock, Azure OpenAI, SGLang...
    validations:
      required: true
  - type: input
    id: api_style
    attributes:
      label: API style
      placeholder: OpenAI-compatible, native REST API, local server...
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Supported capabilities
      description: Which capabilities should the adapter expose?
      placeholder: reasoning, tool-calling, json-mode, vision, streaming, embeddings
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Official docs or references
      description: Link to public docs if available.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Known quirks, usage response format, error format, or pricing.
